; BonDriver_MB8CFW.ini -- put beside BonDriver_MB8CFW.dll (same base name).
; Relative paths are taken from the DLL's folder.
[MB8CFW]
; m2tv | dt295 | vvvv:pppp.  Empty = the first supported device found.
Device=m2tv
; The n-th device of that model (0 = first).  One DLL copy per tuner.
Index=0
; FRC1 container built by MB8AC031-CFW (host/build.py frc1).  Installed
; when the device comes up without CFW (every replug).
Firmware=frc1-m2tv.frc
; How long SetChannel waits for lock.
LockWaitMs=2000
; Host-side TS buffer.
BufferMiB=32
; What the host shows as the tuner's name.
Name=GV-M2TV (CFW)
